<marker id="tri" viewBox="0 0 12 12" refX="11.5" refY="6" markerWidth="14" markerHeight="14" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#FFFFFF" stroke="#333" stroke-width="1"/></marker>
<marker id="open" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#333" stroke-width="1.3"/></marker>
<marker id="diam" viewBox="0 0 14 10" refX="0.5" refY="5" markerWidth="16" markerHeight="12" orient="auto"><path d="M0,5 L7,0 L14,5 L7,10 z" fill="#333"/></marker>
