</defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="32.0" y="46.0" font-family="Inter" font-size="24" font-weight="700" fill="#1A1A1A" text-anchor="start">Nivel 1 · Diagrama de contexto del sistema</text><text x="32.0" y="74.0" font-family="Inter" font-size="15" font-weight="400" fill="#555555" text-anchor="start">Gestor de Turnos Laborales de Grano Dorado: quién lo usa y con qué sistemas externos se comunica</text><circle cx="300.0" cy="142" r="32" fill="#08427B" stroke="#06335F" stroke-width="1.5"/><rect x="140" y="156" width="320" height="144" rx="26" fill="#08427B" stroke="#06335F" stroke-width="1.5"/><text x="300.0" y="200.0" font-family="Inter" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Administrador General</text><text x="300.0" y="218.0" font-family="Inter" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="middle">[Persona]</text><text x="300.0" y="244.0" font-family="Inter" font-size="13" font-weight="400" fill="#FFFFFF" text-anchor="middle">Registra y actualiza empleados, define el</text><text x="300.0" y="261.0" font-family="Inter" font-size="13" font-weight="400" fill="#FFFFFF" text-anchor="middle">catálogo de turnos y programa las 3</text><text x="300.0" y="278.0" font-family="Inter" font-size="13" font-weight="400" fill="#FFFFFF" text-anchor="middle">sucursales.</text><circle cx="800.0" cy="142" r="32" fill="#08427B" stroke="#06335F" stroke-width="1.5"/><rect x="640" y="156" width="320" height="144" rx="26" fill="#08427B" stroke="#06335F" stroke-width="1.5"/><text x="800.0" y="200.0" font-family="Inter" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Administrador de Sucursal</text><text x="800.0" y="218.0" font-family="Inter" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="middle">[Persona]</text><text x="800.0" y="244.0" font-family="Inter" font-size="13" font-weight="400" fill="#FFFFFF" text-anchor="middle">Programa su sucursal, aprueba cambios de</text><text x="800.0" y="261.0" font-family="Inter" font-size="13" font-weight="400" fill="#FFFFFF" text-anchor="middle">turno, revisa novedades y atiende</text><text x="800.0" y="278.0" font-family="Inter" font-size="13" font-weight="400" fill="#FFFFFF" text-anchor="middle">incumplimientos.</text><circle cx="1300.0" cy="142" r="32" fill="#08427B" stroke="#06335F" stroke-width="1.5"/><rect x="1140" y="156" width="320" height="144" rx="26" fill="#08427B" stroke="#06335F" stroke-width="1.5"/><text x="1300.0" y="200.0" font-family="Inter" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Empleado operativo</text><text x="1300.0" y="218.0" font-family="Inter" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="middle">[Persona]</text><text x="1300.0" y="244.0" font-family="Inter" font-size="13" font-weight="400" fill="#FFFFFF" text-anchor="middle">Cajero, barista o cocinero. Consulta su horario,</text><text x="1300.0" y="261.0" font-family="Inter" font-size="13" font-weight="400" fill="#FFFFFF" text-anchor="middle">pide cambios, reporta novedades y marca</text><text x="1300.0" y="278.0" font-family="Inter" font-size="13" font-weight="400" fill="#FFFFFF" text-anchor="middle">asistencia.</text><rect x="400" y="470" width="800" height="170" rx="10" fill="#1168BD" stroke="#0D5193" stroke-width="1.5"/><text x="800.0" y="529.8" font-family="Inter" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Gestor de Turnos Laborales</text><text x="800.0" y="547.8" font-family="Inter" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="middle">[Sistema de software · Grano Dorado]</text><text x="800.0" y="573.8" font-family="Inter" font-size="13" font-weight="400" fill="#FFFFFF" text-anchor="middle">Programa los turnos de 45 empleados en 3 sucursales (06:00 a 22:00) sin conflictos, publica los horarios y registra cambios</text><text x="800.0" y="591.0" font-family="Inter" font-size="13" font-weight="400" fill="#FFFFFF" text-anchor="middle">de turno, novedades y asistencia. Reemplaza el grupo de WhatsApp y el Excel.</text><rect x="140" y="800" width="320" height="140" rx="10" fill="#8C8C8C" stroke="#6D6D6D" stroke-width="1.5"/><text x="300.0" y="844.8" font-family="Inter" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Google</text><text x="300.0" y="862.8" font-family="Inter" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="middle">[Sistema externo]</text><text x="300.0" y="888.8" font-family="Inter" font-size="13" font-weight="400" fill="#FFFFFF" text-anchor="middle">Permite iniciar sesión con la cuenta de Google</text><text x="300.0" y="906.0" font-family="Inter" font-size="13" font-weight="400" fill="#FFFFFF" text-anchor="middle">(HU-01).</text><rect x="640" y="800" width="320" height="140" rx="10" fill="#8C8C8C" stroke="#6D6D6D" stroke-width="1.5"/><text x="800.0" y="844.8" font-family="Inter" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Servicio de correo electrónico</text><text x="800.0" y="862.8" font-family="Inter" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="middle">[Sistema externo]</text><text x="800.0" y="888.8" font-family="Inter" font-size="13" font-weight="400" fill="#FFFFFF" text-anchor="middle">Entrega los correos de activación de cuenta y</text><text x="800.0" y="906.0" font-family="Inter" font-size="13" font-weight="400" fill="#FFFFFF" text-anchor="middle">de recuperación de clave (HU-02, HU-03).</text><rect x="1140" y="800" width="320" height="140" rx="10" fill="#8C8C8C" stroke="#6D6D6D" stroke-width="1.5" stroke-dasharray="8 5"/><text x="1300.0" y="844.8" font-family="Inter" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Servicio de notificaciones</text><text x="1300.0" y="862.8" font-family="Inter" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="middle">[Sistema externo · canal por definir]</text><text x="1300.0" y="888.8" font-family="Inter" font-size="13" font-weight="400" fill="#FFFFFF" text-anchor="middle">Avisa al personal sobre horarios publicados,</text><text x="1300.0" y="906.0" font-family="Inter" font-size="13" font-weight="400" fill="#FFFFFF" text-anchor="middle">cambios de turno e incumplimientos.</text><path d="M300.0,300.0 L300.0,405.0 L560.0,405.0 L560.0,470.0" fill="none" stroke="#707070" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#arr)"/><path d="M800.0,300.0 L800.0,470.0" fill="none" stroke="#707070" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#arr)"/><path d="M1300.0,300.0 L1300.0,405.0 L1040.0,405.0 L1040.0,470.0" fill="none" stroke="#707070" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#arr)"/><path d="M560.0,640.0 L560.0,720.0 L300.0,720.0 L300.0,800.0" fill="none" stroke="#707070" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#arr)"/><path d="M800.0,640.0 L800.0,800.0" fill="none" stroke="#707070" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#arr)"/><path d="M1040.0,640.0 L1040.0,720.0 L1300.0,720.0 L1300.0,800.0" fill="none" stroke="#707070" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#arr)"/><path d="M1460.0,870.0 L1530.0,870.0 L1530.0,225.0 L1460.0,225.0" fill="none" stroke="#707070" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#arr)"/><text x="140.0" y="985.0" font-family="Inter" font-size="14" font-weight="700" fill="#1A1A1A" text-anchor="start">Leyenda</text><circle cx="157.0" cy="1006" r="6" fill="#08427B"/><rect x="146" y="1011" width="22" height="12" rx="5" fill="#08427B"/><text x="184.0" y="1017.0" font-family="Inter" font-size="13" font-weight="400" fill="#333" text-anchor="start">Persona (usuario del sistema)</text><rect x="470" y="1001" width="34" height="22" rx="4" fill="#1168BD"/><text x="514.0" y="1017.0" font-family="Inter" font-size="13" font-weight="400" fill="#333" text-anchor="start">Sistema en alcance</text><rect x="800" y="1001" width="34" height="22" rx="4" fill="#8C8C8C"/><text x="844.0" y="1017.0" font-family="Inter" font-size="13" font-weight="400" fill="#333" text-anchor="start">Sistema externo</text><path d="M140,1042 L174,1042" stroke="#707070" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arr)"/><text x="184.0" y="1047.0" font-family="Inter" font-size="13" font-weight="400" fill="#333" text-anchor="start">Relación (lenguaje no técnico)</text><rect x="470" y="1031" width="34" height="22" rx="4" fill="#85BBF0" stroke="#1A1A1A" stroke-dasharray="5 3"/><text x="514.0" y="1047.0" font-family="Inter" font-size="13" font-weight="400" fill="#333" text-anchor="start">Borde punteado: aún por definir</text><rect x="291.9" y="384.0" width="276.2" height="20.0" fill="#FFFFFF" fill-opacity="0.92"/><text x="430.0" y="397.0" font-family="Inter" font-size="13" font-weight="500" fill="#333" text-anchor="middle">Administra empleados, turnos y sucursales</text><rect x="808.0" y="417.0" width="194.6" height="36.0" fill="#FFFFFF" fill-opacity="0.92"/><text x="812.0" y="430.0" font-family="Inter" font-size="13" font-weight="500" fill="#333" text-anchor="start">Programa su sucursal y revisa</text><text x="812.0" y="446.0" font-family="Inter" font-size="13" font-weight="500" fill="#333" text-anchor="start">solicitudes</text><rect x="1069.5" y="375.0" width="230.9" height="36.0" fill="#FFFFFF" fill-opacity="0.92"/><text x="1185.0" y="388.0" font-family="Inter" font-size="13" font-weight="500" fill="#333" text-anchor="middle">Consulta su horario, pide cambios y</text><text x="1185.0" y="404.0" font-family="Inter" font-size="13" font-weight="500" fill="#333" text-anchor="middle">marca asistencia</text><rect x="198.2" y="695.0" width="203.7" height="20.0" fill="#FFFFFF" fill-opacity="0.92"/><text x="300.0" y="708.0" font-family="Inter" font-size="13" font-weight="500" fill="#333" text-anchor="middle">Verifica la identidad del usuario</text><rect x="695.3" y="699.0" width="209.4" height="36.0" fill="#FFFFFF" fill-opacity="0.92"/><text x="800.0" y="712.0" font-family="Inter" font-size="13" font-weight="500" fill="#333" text-anchor="middle">Envía correos de activación y de</text><text x="800.0" y="728.0" font-family="Inter" font-size="13" font-weight="500" fill="#333" text-anchor="middle">recuperación</text><rect x="1221.8" y="695.0" width="156.5" height="20.0" fill="#FFFFFF" fill-opacity="0.92"/><text x="1300.0" y="708.0" font-family="Inter" font-size="13" font-weight="500" fill="#333" text-anchor="middle">Envía avisos al personal</text><rect x="1491.2" y="547.0" width="77.6" height="36.0" fill="#FFFFFF" fill-opacity="0.92"/><text x="1530.0" y="560.0" font-family="Inter" font-size="13" font-weight="500" fill="#333" text-anchor="middle">Entrega los</text><text x="1530.0" y="576.0" font-family="Inter" font-size="13" font-weight="500" fill="#333" text-anchor="middle">avisos</text></svg>