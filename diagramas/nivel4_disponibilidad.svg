</defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="32.0" y="46.0" font-family="Inter" font-size="24" font-weight="700" fill="#1A1A1A" text-anchor="start">Nivel 4 · Disponibilidad</text><text x="32.0" y="74.0" font-family="Inter" font-size="15" font-weight="400" fill="#555555" text-anchor="start">Diagrama de clases UML (diseño planeado). Zoom al componente «Disponibilidad» del nivel 3 de la API · requerido por HU-07, HU-08, HU-15 y HU-17 (SUP-19). Contenido tomado de las HU.</text><rect x="40" y="130" width="440" height="81" fill="#FFFDF5" stroke="#333" stroke-width="1.3" stroke-dasharray="6 4"/><rect x="40" y="130" width="440" height="50" fill="#DDDDDD" stroke="#333" stroke-width="1.3" stroke-dasharray="6 4"/><text x="260.0" y="150.0" font-family="Inter" font-size="12" font-weight="400" fill="#444" text-anchor="middle">«componente · nivel 3»</text><text x="260.0" y="168.0" font-family="Inter" font-size="15" font-weight="700" fill="#1A1A1A" text-anchor="middle">Motor de validación de conflictos</text><line x1="40" y1="180" x2="480" y2="180" stroke="#333" stroke-width="1.1"/><text x="50.0" y="200.0" font-family="Inter" font-size="13" font-weight="400" fill="#1A1A1A" text-anchor="start">ReglaDiaDisponible (CA-07.2) · Chain</text><rect x="40" y="235" width="440" height="81" fill="#FFFDF5" stroke="#333" stroke-width="1.3" stroke-dasharray="6 4"/><rect x="40" y="235" width="440" height="50" fill="#DDDDDD" stroke="#333" stroke-width="1.3" stroke-dasharray="6 4"/><text x="260.0" y="255.0" font-family="Inter" font-size="12" font-weight="400" fill="#444" text-anchor="middle">«componente · nivel 3»</text><text x="260.0" y="273.0" font-family="Inter" font-size="15" font-weight="700" fill="#1A1A1A" text-anchor="middle">Módulo Turnos y programación</text><line x1="40" y1="285" x2="480" y2="285" stroke="#333" stroke-width="1.1"/><text x="50.0" y="305.0" font-family="Inter" font-size="13" font-weight="400" fill="#1A1A1A" text-anchor="start">la malla marca el día no disponible (CA-08.2)</text><rect x="40" y="340" width="440" height="81" fill="#FFFDF5" stroke="#333" stroke-width="1.3" stroke-dasharray="6 4"/><rect x="40" y="340" width="440" height="50" fill="#DDDDDD" stroke="#333" stroke-width="1.3" stroke-dasharray="6 4"/><text x="260.0" y="360.0" font-family="Inter" font-size="12" font-weight="400" fill="#444" text-anchor="middle">«componente · nivel 3»</text><text x="260.0" y="378.0" font-family="Inter" font-size="15" font-weight="700" fill="#1A1A1A" text-anchor="middle">Módulo Asistencia e incumplimientos</text><line x1="40" y1="390" x2="480" y2="390" stroke="#333" stroke-width="1.1"/><text x="50.0" y="410.0" font-family="Inter" font-size="13" font-weight="400" fill="#1A1A1A" text-anchor="start">no marca ni evalúa ese día (CA-15.4, CA-17.5)</text><rect x="640" y="200" width="560" height="116" fill="#FFFDF5" stroke="#333" stroke-width="1.3"/><rect x="640" y="200" width="560" height="66" fill="#FFF2CC" stroke="#333" stroke-width="1.3"/><text x="920.0" y="220.0" font-family="Inter" font-size="12" font-weight="400" fill="#444" text-anchor="middle">«servicio»</text><text x="920.0" y="238.0" font-family="Inter" font-size="15" font-weight="700" fill="#1A1A1A" text-anchor="middle">ConsultaDisponibilidad</text><text x="920.0" y="255.0" font-family="Inter" font-size="11.5" font-weight="400" fill="#7A5A00" text-anchor="middle">solo lectura: es lo que piden las HU</text><line x1="640" y1="266" x2="1200" y2="266" stroke="#333" stroke-width="1.1"/><text x="650.0" y="286.0" font-family="Inter" font-size="13" font-weight="400" fill="#1A1A1A" text-anchor="start">+ estadoDelDia(empleado, fecha): TipoNoDisponibilidad?</text><text x="650.0" y="305.0" font-family="Inter" font-size="13" font-weight="400" fill="#1A1A1A" text-anchor="start">+ diasNoDisponibles(empleado, semana): List&lt;RegistroNoDisponibilidad&gt;</text><path d="M480.0,170.5 L540.0,170.5 L540.0,260.0 L640.0,260.0" fill="none" stroke="#333" stroke-width="1.3" stroke-dasharray="7 5" m