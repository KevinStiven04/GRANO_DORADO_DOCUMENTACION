ado</text><text x="650.0" y="569.0" font-family="Inter" font-size="13" font-weight="400" fill="#1A1A1A" text-anchor="start">- fecha: Fecha</text><text x="650.0" y="588.0" font-family="Inter" font-size="13" font-weight="400" fill="#1A1A1A" text-anchor="start">- tipo: TipoNoDisponibilidad</text><rect x="1080" y="480" width="280" height="119" fill="#FFFDF5" stroke="#333" stroke-width="1.3"/><rect x="1080" y="480" width="280" height="50" fill="#E6F4EA" stroke="#333" stroke-width="1.3"/><text x="1220.0" y="500.0" font-family="Inter" font-size="12" font-weight="400" fill="#444" text-anchor="middle">«enumeración»</text><text x="1220.0" y="518.0" font-family="Inter" font-size="15" font-weight="700" fill="#1A1A1A" text-anchor="middle">TipoNoDisponibilidad</text><line x1="1080" y1="530" x2="1360" y2="530" stroke="#333" stroke-width="1.1"/><text x="1090.0" y="550.0" font-family="Inter" font-size="13" font-weight="400" fill="#1A1A1A" text-anchor="start">DESCANSO</text><text x="1090.0" y="569.0" font-family="Inter" font-size="13" font-weight="400" fill="#1A1A1A" text-anchor="start">VACACIONES</text><text x="1090.0" y="588.0" font-family="Inter" font-size="13" font-weight="400" fill="#1A1A1A" text-anchor="start">INCAPACIDAD</text><path d="M800.0,316.0 L800.0,480.0" fill="none" stroke="#333" stroke-width="1.3" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="40" y="660" width="1720" height="58.875" rx="6" fill="#FFF8E1" stroke="#E0C068"/><text x="52.0" y="684.0" font-family="Inter" font-size="12.5" font-weight="700" fill="#1A1A1A" text-anchor="start">Patrones GoF en este componente</text><text x="52.0" y="706.0" font-family="Inter" font-size="12.5" font-weight="400" fill="#333" text-anchor="start">Ningún patrón propio: es una consulta de solo lectura. ConsultaDisponibilidad alimenta el eslabón ReglaDiaDisponible del Motor de validación (Chain of Responsibility).</text><text x="40.0" y="748.9" font-family="Inter" font-size="14" font-weight="700" fill="#1A1A1A" text-anchor="start">Leyenda</text><rect x="40" y="764.875" width="34" height="18" fill="#FFF2CC" stroke="#333"/><text x="84.0" y="778.9" font-family="Inter" font-size="12.5" font-weight="400" fill="#333" text-anchor="start">Clase de servicio (operaciones de las HU)</text><rect x="440" y="764.875" width="34" height="18" fill="#E6F4EA" stroke="#333"/><text x="484.0" y="778.9" font-family="Inter" font-size="12.5" font-weight="400" fill="#333" text-anchor="start">Entidad / enumeración</text><rect x="840" y="764.875" width="34" height="18" fill="#F3E5F5" stroke="#333"/><text x="884.0" y="778.9" font-family="Inter" font-size="12.5" font-weight="400" fill="#333" text-anchor="start">Valor o resultado</text><rect x="40" y="792.875" width="34" height="18" fill="#F7F7F7" stroke="#333"/><text x="84.0" y="806.9" font-family="Inter" font-size="12.5" font-weight="400" fill="#333" text-anchor="start">Consulta (vista de solo lectura)</text><rect x="440" y="792.875" width="34" height="18" fill="#DDDDDD" stroke="#333" stroke-dasharray="4 3"/><text x="484.0" y="806.9" font-family="Inter" font-size="12.5" font-weight="400" fill="#333" text-anchor="start">Otro componente del nivel 3</text><rect x="840" y="792.875" width="34" height="18" fill="#BDBDBD" stroke="#333" stroke-dasharray="4 3"/><text x="884.0" y="806.9" font-family="Inter" font-size="12.5" font-weight="400" fill="#333" text-anchor="start">Sistema externo</text><path d="M40.0,829.9 L74.0,829.9" fill="none" stroke="#333" stroke-width="1.3" stroke-dasharray="7 5" marker-end="url(#open)"/><text x="84.0" y="834.9" font-family="Inter" font-size="12.5" font-weight="400" fill="#333" text-anchor="start">Usa / depende de</text><path d="M440.0,829.9 L474.0,829.9" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#open)" marker-start="url(#diam)"/><text x="484.0" y="834.9" font-family="Inter" font-size="12.5" font-weight="400" fill="#333" text-anchor="start">Compuesto por (multiplicidad)</text><rect x="1268.1" y="242.0" width="23.8" height=