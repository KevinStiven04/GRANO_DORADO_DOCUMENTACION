<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1400" viewBox="0 0 1800 1400"><defs>
<marker id="arr" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#707070" stroke="none"/></marker>
<marker id="tri" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="12" markerHeight="12" orient="auto"><path d="M1,1 L13,7 L1,13 z" fill="#FFFFFF" stroke="#333" stroke-width="1.2" stroke-dasharray="none"/></marker>
<marker id="open" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#333" stroke-width="1.3" stroke-dasharray="none"/></marker>
<marker id="diam" viewBox="0 0 14 10" refX="0.5" refY="5" markerWidth="16" markerHeight="12" orient="auto"><path d="M0,5 L7,0 L14,5 L7,10 z" fill="#333"/></marker>
<marker id="sarr" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
</defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="32.0" y="46.0" font-family="Inter" font-size="24" font-weight="700" fill="#1A1A1A" text-anchor="start">Nivel 2 · Diagrama de contenedores</text><text x="32.0" y="74.0" font-family="Inter" font-size="15" font-weight="400" fill="#555555" text-anchor="start">Zoom al Gestor de Turnos Laborales: aplicaciones, API, base de datos, tecnologías y protocolos</text><circle cx="575.0" cy="132" r="32" fill="#08427B" stroke="#06335F" stroke-width="1.5"/><rect x="385" y="146" width="380" height="139" rx="26" fill="#08427B" stroke="#06335F" stroke-width="1.5"/><text x="575.0" y="190.0" font-family="Inter" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Personal de Grano Dorado</text><text x="575.0" y="208.0" font-family="Inter" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="middle">[Personas]</text><text x="575.0" y="234.0" font-family="Inter" font-size="13" font-weight="400" fill="#FFFFFF" text-anchor="middle">Administrador General, Administrador de Sucursal y</text><text x="575.0" y="251.0" font-family="Inter" font-size="13" font-weight="400" fill="#FFFFFF" text-anchor="middle">empleados operativos (45 personas, 3 sucursales).</text><rect x="60" y="330" width="1030" height="900" rx="6" fill="none" stroke="#444" stroke-width="1.6" stroke-dasharray="10 6"/><text x="76.0" y="1200.0" font-family="Inter" font-size="16" font-weight="700" fill="#222" text-anchor="start">Gestor de Turnos Laborales</text><text x="76.0" y="1218.0" font-family="Inter" font-size="12" font-weight="400" fill="#444" text-anchor="start">[Sistema de software · límite del sistema]</text><rect x="360" y="400" width="430" height="200" rx="10" fill="#438DD5" stroke="#346DA6" stroke-width="1.5"/><rect x="368" y="408" width="414" height="18" rx="5" fill="#FFFFFF" fill-opacity="0.25"/><circle cx="378" cy="417" r="3.5" fill="#FFFFFF" fill-opacity="0.8"/><circle cx="390" cy="417" r="3.5" fill="#FFFFFF" fill-opacity="0.8"/><circle cx="402" cy="417" r="3.5" fill="#FFFFFF" fill-opacity="0.8"/><text x="575.0" y="475.3" font-family="Inter" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Aplicación web</text><text x="575.0" y="493.3" font-family="Inter" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="middle">[Contenedor: Kotlin/Wasm + Compose Multiplatform]</text><text x="575.0" y="519.3" font-family="Inter" font-size="13" font-weight="400" fill="#FFFFFF" text-anchor="middle">Interfaz responsiva para computador y navegador móvil</text><text x="575.0" y="536.4" font-family="Inter" font-size="13" font-weight="400" fill="#FFFFFF" text-anchor="middle">(RNF-04). Módulo shared con 9 pantallas y 8 ViewModels</text><text x="575.0" y="553.6" font-family="Inter" font-size="13" font-weight="400" fill="#FFFFFF" text-anchor="middle">(MVVM + StateFlow).</text><rect x="694.0" y="391" width="88.0" height="18" rx="9" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.4"/><text x="738.0" y="404.0" font-family="Inter" font-size="10.5" font-weight="700" fill="#2E7D32" text-anchor="middle">EN EL CÓDIGO</text><rect x="300" y="700" width="550" height="210" rx="10" fill="#438DD5" stroke="#346DA6" stroke-width="1.5"/><text x="575.0" y="771.3" font-family="Inter" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">API REST de turnos</text><text x="575.0" y="789.3" font-family="Inter" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="middle">[Contenedor: Kotlin + Ktor · JVM]</text><text x="575.0" y="815.3" font-family="Inter" font-size="13" font-weight="400" fill="#FFFFFF" text-anchor="middle">Autentica con JWT, aplica la matriz de permisos por rol y sucursal y todas las reglas</text><text x="575.0" y="832.4" font-family="Inter" font-size="13" font-weight="400" fill="#FFFFFF" text-anchor="middle">de negocio de las HU. Capas: rutas → servicios → repositorios, con inyección de</text><text x="575.0" y="849.6" font-family="Inter" font-size="13" font-weight="400" fill="#FFFFFF" text-anchor="middle">dependencias (Koin). Toma la hora oficial del servidor (HU-15).</text><rect x="769.5" y="691" width="72.5" height="18" rx="9" fill="#FFFFFF" stroke="#B26A00" stroke-width="1.4"/><text x="805.8" y="704.0" font-family="Inter" font-size="10.5" font-weight="700" fill="#B26A00" text-anchor="middle">PLANEADO</text><path d="M345,1014 L345,1136 A230.0,14 0 0 0 805,1136 L805,1014 A230.0,14 0 0 0 345,1014 z" fill="#438DD5" stroke="#346DA6" stroke-width="1.5"/><path d="M345,1014 A230.0,14 0 0 0 805,1014" fill="none" stroke="#346DA6" stroke-width="1.5"/><text x="575.0" y="1057.8" font-family="Inter" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Base de datos</text><text x="575.0" y="1075.8" font-family="Inter" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="middle">[Contenedor: Firebase · Cloud Firestore]</text><text x="575.0" y="1101.8" font-family="Inter" font-size="13" font-weight="400" fill="#FFFFFF" text-anchor="middle">Empleados, catálogo de turnos, semanas y asignaciones, solicitudes</text><text x="575.0" y="1119.0" font-family="Inter" font-size="13" font-weight="400" fill="#FFFFFF" text-anchor="middle">de cambio, novedades, marcas de asistencia e historial de auditoría.</text><rect x="724.5" y="991" width="72.5" height="18" rx="9" fill="#FFFFFF" stroke="#B26A00" stroke-width="1.4"/><text x="760.8" y="1004.0" font-family="Inter" font-size="10.5" font-weight="700" fill="#B26A00" text-anchor="middle">PLANEADO</text><rect x="1340" y="560" width="400" height="120" rx="10" fill="#8C8C8C" stroke="#6D6D6D" stroke-width="1.5"/><text x="1540.0" y="603.4" font-family="Inter" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Google</text><text x="1540.0" y="621.4" font-family="Inter" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="middle">[Sistema externo · OpenID Connect]</text><text x="1540.0" y="647.4" font-family="Inter" font-size="13" font-weight="400" fill="#FFFFFF" text-anchor="middle">Inicio de sesión con cuenta de Google (HU-01).</text><rect x="1340" y="760" width="400" height="120" rx="10" fill="#8C8C8C" stroke="#6D6D6D" stroke-width="1.5"/><text x="1540.0" y="794.8" font-family="Inter" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Servicio de correo</text><text x="1540.0" y="812.8" font-family="Inter" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="middle">[Sistema externo · SMTP]</text><text x="1540.0" y="838.8" font-family="Inter" font-size="13" font-weight="400" fill="#FFFFFF" text-anchor="middle">Correos de activación y recuperación de clave (HU-02,</text><text x="1540.0" y="856.0" font-family="Inter" font-size="13" font-weight="400" fill="#FFFFFF" text-anchor="middle">HU-03).</text><rect x="1340" y="960" width="400" height="120" rx="10" fill="#8C8C8C" stroke="#6D6D6D" stroke-width="1.5" stroke-dasharray="8 5"/><text x="1540.0" y="994.8" font-family="Inter" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Servicio de notificaciones</text><text x="1540.0" y="1012.8" font-family="Inter" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="middle">[Sistema externo · por definir (HU-17)]</text><text x="1540.0" y="1038.8" font-family="Inter" font-size="13" font-weight="400" fill="#FFFFFF" text-anchor="middle">Avisos de horario publicado, cambios de turno e</text><text x="1540.0" y="1056.0" font-family="Inter" font-size="13" font-weight="400" fill="#FFFFFF" text-anchor="middle">incumplimientos.</text><path d="M575.0,285.0 L575.0,400.0" fill="none" stroke="#707070" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#arr)"/><path d="M575.0,600.0 L575.0,700.0" fill="none" stroke="#707070" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#arr)"/><path d="M575.0,910.0 L575.0,1000.0" fill="none" stroke="#707070" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#arr)"/><path d="M850.0,760.0 L1170.0,760.0 L1170.0,620.0 L1340.0,620.0" fill="none" stroke="#707070" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#arr)"/><path d="M850.0,820.0 L1340.0,820.0" fill="none" stroke="#707070" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#arr)"/><path d="M850.0,885.0 L1170.0,885.0 L1170.0,1020.0 L1340.0,1020.0" fill="none" stroke="#707070" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#arr)"/><rect x="1340" y="1110" width="400" height="126.375" rx="6" fill="#FFF8E1" stroke="#E0C068"/><text x="1352.0" y="1134.0" font-family="Inter" font-size="12.5" font-weight="700" fill="#1A1A1A" text-anchor="start">Seguridad</text><text x="1352.0" y="1156.0" font-family="Inter" font-size="12.5" font-weight="400" fill="#333" text-anchor="start">Todo el tráfico va por HTTPS/TLS. Sesión con JWT que expira</text><text x="1352.0" y="1172.9" font-family="Inter" font-size="12.5" font-weight="400" fill="#333" text-anchor="start">a los 30 min de inactividad (HU-01). Bloqueo de 15 min tras 5</text><text x="1352.0" y="1189.8" font-family="Inter" font-size="12.5" font-weight="400" fill="#333" text-anchor="start">intentos fallidos. Contraseñas cifradas con bcrypt (RNF-06). La</text><text x="1352.0" y="1206.6" font-family="Inter" font-size="12.5" font-weight="400" fill="#333" text-anchor="start">API revalida permisos aunque se entre por URL directa</text><text x="1352.0" y="1223.5" font-family="Inter" font-size="12.5" font-weight="400" fill="#333" text-anchor="start">(CA-01.6).</text><text x="60.0" y="1265.0" font-family="Inter" font-size="14" font-weight="700" fill="#1A1A1A" text-anchor="start">Leyenda</text><circle cx="77.0" cy="1286" r="6" fill="#08427B"/><rect x="66" y="1291" width="22" height="12" rx="5" fill="#08427B"/><text x="104.0" y="1297.0" font-family="Inter" font-size="13" font-weight="400" fill="#333" text-anchor="start">Persona</text><rect x="420" y="1281" width="34" height="22" rx="4" fill="#438DD5"/><text x="464.0" y="1297.0" font-family="Inter" font-size="13" font-weight="400" fill="#333" text-anchor="start">Contenedor (aplicación, API)</text><path d="M780,1285 L780,1299 A17,4 0 0 0 814,1299 L814,1285 A17,4 0 0 0 780,1285 z" fill="#438DD5"/><path d="M780,1285 A17,4 0 0 0 814,1285" fill="none" stroke="#2F6CA8"/><text x="824.0" y="1297.0" font-family="Inter" font-size="13" font-weight="400" fill="#333" text-anchor="start">Contenedor de base de datos</text><rect x="60" y="1311" width="34" height="22" rx="4" fill="#8C8C8C"/><text x="104.0" y="1327.0" font-family="Inter" font-size="13" font-weight="400" fill="#333" text-anchor="start">Sistema externo</text><rect x="420" y="1311" width="34" height="22" rx="3" fill="none" stroke="#444" stroke-dasharray="5 3"/><text x="464.0" y="1327.0" font-family="Inter" font-size="13" font-weight="400" fill="#333" text-anchor="start">Límite del sistema (zoom del nivel 1)</text><path d="M780,1322 L814,1322" stroke="#707070" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arr)"/><text x="824.0" y="1327.0" font-family="Inter" font-size="13" font-weight="400" fill="#333" text-anchor="start">Relación [tecnología / protocolo]</text><rect x="60" y="1344" width="34" height="16" rx="8" fill="#FFF" stroke="#2E7D32" stroke-width="1.6"/><text x="104.0" y="1357.0" font-family="Inter" font-size="13" font-weight="400" fill="#333" text-anchor="start">Existe en el código</text><rect x="420" y="1344" width="34" height="16" rx="8" fill="#FFF" stroke="#B26A00" stroke-width="1.6"/><text x="464.0" y="1357.0" font-family="Inter" font-size="13" font-weight="400" fill="#333" text-anchor="start">Planeado, aún no existe</text><rect x="780" y="1341" width="34" height="22" rx="4" fill="#85BBF0" stroke="#1A1A1A" stroke-dasharray="5 3"/><text x="824.0" y="1357.0" font-family="Inter" font-size="13" font-weight="400" fill="#333" text-anchor="start">Borde punteado: por definir</text><rect x="586.0" y="322.0" width="192.9" height="51.0" fill="#FFFFFF" fill-opacity="0.92"/><text x="590.0" y="335.0" font-family="Inter" font-size="13" font-weight="500" fill="#333" text-anchor="start">Usa desde el computador o el</text><text x="590.0" y="351.0" font-family="Inter" font-size="13" font-weight="500" fill="#333" text-anchor="start">navegador del móvil</text><text x="590.0" y="366.0" font-family="Inter" font-size="11.5" font-weight="400" fill="#666" text-anchor="start">[HTTPS]</text><rect x="586.0" y="632.0" width="164.9" height="35.0" fill="#FFFFFF" fill-opacity="0.92"/><text x="590.0" y="645.0" font-family="Inter" font-size="13" font-weight="500" fill="#333" text-anchor="start">Consume la API</text><text x="590.0" y="660.0" font-family="Inter" font-size="11.5" font-weight="400" fill="#666" text-anchor="start">[JSON / HTTPS · token JWT]</text><rect x="586.0" y="932.0" width="243.1" height="35.0" fill="#FFFFFF" fill-opacity="0.92"/><text x="590.0" y="945.0" font-family="Inter" font-size="13" font-weight="500" fill="#333" text-anchor="start">Lee y escribe</text><text x="590.0" y="960.0" font-family="Inter" font-size="11.5" font-weight="400" fill="#666" text-anchor="start">[Firebase Admin SDK · gRPC sobre HTTPS]</text><rect x="882.3" y="713.0" width="165.3" height="35.0" fill="#FFFFFF" fill-opacity="0.92"/><text x="965.0" y="726.0" font-family="Inter" font-size="13" font-weight="500" fill="#333" text-anchor="middle">Valida el token de Google</text><text x="965.0" y="741.0" font-family="Inter" font-size="11.5" font-weight="400" fill="#666" text-anchor="middle">[OpenID Connect / HTTPS]</text><rect x="918.5" y="788.0" width="92.9" height="35.0" fill="#FFFFFF" fill-opacity="0.92"/><text x="965.0" y="801.0" font-family="Inter" font-size="13" font-weight="500" fill="#333" text-anchor="middle">Envía correos</text><text x="965.0" y="816.0" font-family="Inter" font-size="11.5" font-weight="400" fill="#666" text-anchor="middle">[SMTP / TLS]</text><rect x="884.3" y="838.0" width="161.4" height="35.0" fill="#FFFFFF" fill-opacity="0.92"/><text x="965.0" y="851.0" font-family="Inter" font-size="13" font-weight="500" fill="#333" text-anchor="middle">Envía avisos</text><text x="965.0" y="866.0" font-family="Inter" font-size="11.5" font-weight="400" fill="#666" text-anchor="middle">[HTTPS · API del proveedor]</text></svg>