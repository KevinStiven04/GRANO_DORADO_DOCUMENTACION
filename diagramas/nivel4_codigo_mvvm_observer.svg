</defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="32.0" y="46.0" font-family="Inter" font-size="24" font-weight="700" fill="#1A1A1A" text-anchor="start">Nivel 4 · Código: MVVM con patrón Observer en Novedades</text><text x="32.0" y="74.0" font-family="Inter" font-size="15" font-weight="400" fill="#555555" text-anchor="start">Diagrama de clases UML del código existente. Zoom a la funcionalidad «Novedades» del nivel 3 de la aplicación.</text><rect x="60" y="130" width="470" height="166" fill="#FFFDF5" stroke="#333" stroke-width="1.3"/><rect x="60" y="130" width="470" height="66" fill="#FFF2CC" stroke="#333" stroke-width="1.3"/><text x="295.0" y="150.0" font-family="Inter" font-size="12" font-weight="400" fill="#444" text-anchor="middle">«@Composable»</text><text x="295.0" y="168.0" font-family="Inter" font-size="15" font-weight="700" fill="#1A1A1A" text-anchor="middle">NovedadesScreen</text><text x="295.0" y="185.0" font-family="Inter" font-size="11.5" font-weight="400" fill="#7A5A00" text-anchor="middle">Vista · Observador</text><line x1="60" y1="265" x2="530" y2="265" stroke="#333" stroke-width="1.1"/><text x="70.0" y="216.0" font-family="Inter" font-size="13" font-weight="400" fill="#1A1A1A" text-anchor="start">~ viewModel: NovedadesViewModel  (parámetro)</text><text x="70.0" y="235.0" font-family="Inter" font-size="13" font-weight="400" fill="#1A1A1A" text-anchor="start">~ state by uiState.collectAsState()</text><text x="70.0" y="254.0" font-family="Inter" font-size="13" font-weight="400" fill="#1A1A1A" text-anchor="start">~ menuExpandido by remember { false }</text><text x="70.0" y="285.0" font-family="Inter" font-size="13" font-weight="400" fill="#1A1A1A" text-anchor="start">DropdownMenu de filtro + LazyColumn</text><rect x="660" y="130" width="500" height="131" fill="#FFFDF5" stroke="#333" stroke-width="1.3"/><rect x="660" y="130" width="500" height="50" fill="#FFF2CC" stroke="#333" stroke-width="1.3"/><text x="910.0" y="151.0" font-family="Inter