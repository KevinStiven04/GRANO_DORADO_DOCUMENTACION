="820.0" font-family="Inter" font-size="12" font-weight="400" fill="#444" text-anchor="middle">«@Composable»</text><text x="295.0" y="838.0" font-family="Inter" font-size="15" font-weight="700" fill="#1A1A1A" text-anchor="middle">NovedadCard</text><text x="295.0" y="855.0" font-family="Inter" font-size="11.5" font-weight="400" fill="#7A5A00" text-anchor="middle">components/MainComponents.kt</text><line x1="60" y1="897" x2="530" y2="897" stroke="#333" stroke-width="1.1"/><text x="70.0" y="886.0" font-family="Inter" font-size="13" font-weight="400" fill="#1A1A1A" text-anchor="start">~ novedad: Novedad  (único parámetro)</text><path d="M1160.0,200.0 L1284.0,200.0" fill="none" stroke="#333" stroke-width="1.3"/><path d="M1300.0,200.0 L1284.0,209.0 L1284.0,191.0 z" fill="#FFFFFF" stroke="#333" stroke-width="1.3"/><path d="M1300.0,520.0 L1176.0,520.0" fill="none" stroke="#333" stroke-width="1.3"/><path d="M1160.0,520.0 L1176.0,511.0 L1176.0,529.0 z" fill="#FFFFFF" stroke="#333" stroke-width="1.3"/><path d="M1060.0,261.0 L1060.0,400.0 L1420.0,400.0 L1420.0,450.0" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#open)" marker-start="url(#diam)"/><path d="M530.0,200.0 L660.0,200.0" fill="none" stroke="#333" stroke-width="1.3" stroke-dasharray="7 5" marker-end="url(#open)"/><path d="M380.0,296.0 L380.0,520.0 L660.0,520.0" fill="none" stroke="#333" stroke-width="1.3" stroke-dasharray="7 5" marker-end="url(#open)"/><path d="M910.0,578.0 L910.0,760.0" fill="none" stroke="#333" stroke-width="1.3" stroke-dasharray="7 5" marker-end="url(#open)"/><path d="M1160.0,860.0 L1300.0,860.0" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#open)" marker-start="url(#diam)"/><path d="M180.0,296.0 L180.0,800.0" fill="none" stroke="#333" stroke-width="1.3" stroke-dasharray="7 5" marker-end="url(#open)"/><path d="M295.0,928.0 L295.0,1080.0 L1510.0,1080.0 L1510.0,931.0" fill="none" stroke="#333" stroke-width="1.3" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="240" y="590" width="390" height="109.5" rx="6" fill="#FFF8E1" stroke="#E0C068"/><text x="252.0" y="614.0" font-family="Inter" font-size="12.5" font-weight="700" fill="#1A1A1A" text-anchor="start">Cómo se lee</text><text x="252.0" y="636.0" font-family="Inter" font-size="12.5" font-weight="400" fill="#333" text-anchor="start">Observer: la pantalla se suscribe al StateFlow y Compose</text><text x="252.0" y="652.9" font-family="Inter" font-size="12.5" font-weight="400" fill="#333" text-anchor="start">redibuja solo lo que cambia. Los eventos suben con</text><text x="252.0" y="669.8" font-family="Inter" font-size="12.5" font-weight="400" fill="#333" text-anchor="start">cambiarFiltro() y el estado baja por uiState (flujo</text><text x="252.0" y="686.6" font-family="Inter" font-size="12.5" font-weight="400" fill="#333" text-anchor="start">unidireccional).</text><rect x="1206.2" y="178.0" width="47.6" height="16" fill="#FFFFFF"/><text x="1230.0" y="190.0" font-family="Inter" font-size="12.5" font-weight="500" fill="#333" text-anchor="middle">hereda</text><rect x="1201.2" y="498.0" width="57.6" height="16" fill="#FFFFFF"/><text x="1230.0" y="510.0" font-family="Inter" font-size="12.5" font-weight="500" fill="#333" text-anchor="middle">extiende</text><rect x="1213.3" y="380.0" width="53.4" height="16" fill="#FFFFFF"/><text x="1240.0" y="392.0" font-family="Inter" font-size="12.5" font-weight="500" fill="#333" text-anchor="middle">_uiState</text><rect x="548.0" y="178.0" width="94.0" height="16" fill="#FFFFFF"/><text x="595.0" y="190.0" font-family="Inter" font-size="12.5" font-weight="500" fill="#333" text-anchor="middle">cambiarFiltro()</text><rect x="429.6" y="498.0" width="180.9" height="16" fill="#FFFFFF"/><text x="520.0" y="510.0" font-family="Inter" font-size="12.5" font-weight="500" fill="#333" text-anchor="middle">collectAsState() · se suscribe</text><rect x="919.0" y="704.0" width="141.1" height="16" fill="#FFFFFF"/><text x="922.0" y="716.0" font-family="Inter" font-size="12.5" font-weight="500" fill="#333" text-anchor="start">emite NovedadesState</text><rect x="1216.1" y="838.0" width="27.8" height="16" fill="#FFFFFF"/><text x="1230.0" y="850.0" font-family="Inter" font-size="12.5" font-weight="500" fill="#333" text-anchor="middle">0..*</text><rect x="189.0" y="688.0" width="152.1" height="16" fill="#FFFFFF"/><text x="192.0" y="700.0" font-family="Inter" font-size="12.5" font-weight="500" fill="#333" text-anchor="start">una por novedad filtrada</text><rect x="878.3" y="1060.0" width="43.4" height="16" fill="#FFFFFF"/><text x="900.0" y="1072.0" font-family="Inter" font-size="12.5" font-weight="500" fill="#333" text-anchor="middle">recibe</text></svg>