<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1090.875" viewBox="0 0 1800 1090.875"><defs>
<marker id="arr" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#707070" stroke="none"/></marker>
<marker id="tri" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="12" markerHeight="12" orient="auto"><path d="M1,1 L13,7 L1,13 z" fill="#FFFFFF" stroke="#333" stroke-width="1.2" stroke-dasharray="none"/></marker>
<marker id="open" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#333" stroke-width="1.3" stroke-dasharray="none"/></marker>
<marker id="diam" viewBox="0 0 14 10" refX="0.5" refY="5" markerWidth="16" markerHeight="12" orient="auto"><path d="M0,5 L7,0 L14,5 L7,10 z" fill="#333"/></marker>
<marker id="sarr" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
</defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="32.0" y="46.0" font-family="Inter" font-size="24" font-weight="700" fill="#1A1A1A" text-anchor="start">Nivel 4 · Planificador de tareas</text><text x="32.0" y="74.0" font-family="Inter" font-size="15" font-weight="400" fill="#555555" text-anchor="start">Diagrama de clases UML (diseño planeado). Zoom al componente «Planificador de tareas» del nivel 3 de la API · HU-10 · HU-15 · HU-17. Contenido tomado de las HU.</text><rect x="40" y="130" width="640" height="204" fill="#FFFDF5" stroke="#333" stroke-width="1.3"/><rect x="40" y="130" width="640" height="66" fill="#FFF2CC" stroke="#333" stroke-width="1.3"/><text x="360.0" y="150.0" font-family="Inter" font-size="12" font-weight="400" fill="#444" text-anchor="middle">«servicio»</text><text x="360.0" y="168.0" font-family="Inter" font-size="15" font-weight="700" fill="#1A1A1A" text-anchor="middle">PlanificadorTareas</text><text x="360.0" y="185.0" font-family="Inter" font-size="11.5" font-weight="400" fill="#7A5A00" text-anchor="middle">«el sistema evalúa los turnos del día» (CA-17.1)</text><line x1="40" y1="196" x2="680" y2="196" stroke="#333" stroke-width="1.1"/><text x="50.0" y="216.0" font-family="Inter" font-size="13" font-weight="400" fill="#1A1A1A" text-anchor="start">- umbralInicioMinutos: Int = 15</text><line x1="40" y1="227" x2="680" y2="227" stroke="#333" stroke-width="1.1"/><text x="50.0" y="247.0" font-family="Inter" font-size="13" font-weight="400" fill="#1A1A1A" text-anchor="start">+ evaluarTurnosDelDia(ahora)</text><text x="50.0" y="266.0" font-family="Inter" font-size="13" font-weight="400" fill="#1A1A1A" text-anchor="start">- generarIncumplimientosDeInicio(ahora)</text><text x="50.0" y="285.0" font-family="Inter" font-size="13" font-weight="400" fill="#1A1A1A" text-anchor="start">- avisarTurnosSinMarcaDeFin(ahora)</text><text x="50.0" y="304.0" font-family="Inter" font-size="13" font-weight="400" fill="#1A1A1A" text-anchor="start">- marcarPendientesDeCierre(finDelDia)</text><text x="50.0" y="323.0" font-family="Inter" font-size="13" font-weight="400" fill="#1A1A1A" text-anchor="start">- vencerSolicitudes(ahora)</text><rect x="1300" y="130" width="460" height="100" fill="#FFFDF5" stroke="#333" stroke-width="1.3" stroke-dasharray="6 4"/><rect x="1300" y="130" width="460" height="50" fill="#DDDDDD" stroke="#333" stroke-width="1.3" stroke-dasharray="6 4"/><text x="1530.0" y="150.0" font-family="Inter" font-size="12" font-weight="400" fill="#444" text-anchor="middle">«componente · nivel 3»</text><text x="1530.0" y="168.0" font-family="Inter" font-size="15" font-weight="700" fill="#1A1A1A" text-anchor="middle">Módulo Asistencia e incumplimientos</text><line x1="1300" y1="180" x2="1760" y2="180" stroke="#333" stroke-width="1.1"/><text x="1310.0" y="200.0" font-family="Inter" font-size="13" font-weight="400" fill="#1A1A1A" text-anchor="start">+ evaluarTurnosDelDia(ahora)</text><text x="1310.0" y="219.0" font-family="Inter" font-size="13" font-weight="400" fill="#1A1A1A" text-anchor="start">+ marcarPendientesDeCierre(finDelDia)</text><rect x="1300" y="300" width="460" height="81" fill="#FFFDF5" stroke="#333" stroke-width="1.3" stroke-dasharray="6 4"/><rect x="1300" y="300" width="460" height="50" fill="#DDDDDD" stroke="#333" stroke-width="1.3" stroke-dasharray="6 4"/><text x="1530.0" y="320.0" font-family="Inter" font-size="12" font-weight="400" fill="#444" text-anchor="middle">«componente · nivel 3»</text><text x="1530.0" y="338.0" font-family="Inter" font-size="15" font-weight="700" fill="#1A1A1A" text-anchor="middle">Módulo Cambios de turno</text><line x1="1300" y1="350" x2="1760" y2="350" stroke="#333" stroke-width="1.1"/><text x="1310.0" y="370.0" font-family="Inter" font-size="13" font-weight="400" fill="#1A1A1A" text-anchor="start">+ vencerPendientes(ahora)</text><path d="M680.0,221.8 L760.0,221.8 L760.0,180.0 L1300.0,180.0" fill="none" stroke="#333" stroke-width="1.3" stroke-dasharray="7 5" marker-end="url(#open)"/><path d="M680.0,293.2 L782.0,293.2 L782.0,340.5 L1300.0,340.5" fill="none" stroke="#333" stroke-width="1.3" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="40" y="470" width="1720" height="230" rx="6" fill="#FFF8E1" stroke="#E0C068"/><text x="54.0" y="496.0" font-family="Inter" font-size="13.5" font-weight="700" fill="#1A1A1A" text-anchor="start">Tarea → historia → efecto</text><text x="54.0" y="530.0" font-family="Inter" font-size="12.5" font-weight="700" fill="#1A1A1A" text-anchor="start">generarIncumplimientosDeInicio</text><text x="340.0" y="530.0" font-family="Inter" font-size="12.5" font-weight="400" fill="#2F5F94" text-anchor="start">HU-17</text><text x="460.0" y="530.0" font-family="Inter" font-size="12.5" font-weight="400" fill="#333" text-anchor="start">A los 15 min sin marca de inicio: incumplimiento Pendiente y aviso al Administrador de Sucursal; uno por turno.</text><text x="54.0" y="568.0" font-family="Inter" font-size="12.5" font-weight="700" fill="#1A1A1A" text-anchor="start">avisarTurnosSinMarcaDeFin</text><text x="340.0" y="568.0" font-family="Inter" font-size="12.5" font-weight="400" fill="#2F5F94" text-anchor="start">HU-17</text><text x="460.0" y="568.0" font-family="Inter" font-size="12.5" font-weight="400" fill="#333" text-anchor="start">Al final del turno sin marca de fin: aviso para que el supervisor la complete.</text><text x="54.0" y="606.0" font-family="Inter" font-size="12.5" font-weight="700" fill="#1A1A1A" text-anchor="start">marcarPendientesDeCierre</text><text x="340.0" y="606.0" font-family="Inter" font-size="12.5" font-weight="400" fill="#2F5F94" text-anchor="start">HU-15</text><text x="460.0" y="606.0" font-family="Inter" font-size="12.5" font-weight="400" fill="#333" text-anchor="start">Turno sin marca de fin al terminar el día: queda «pendiente de cierre» y así lo ve el supervisor (HU-16).</text><text x="54.0" y="644.0" font-family="Inter" font-size="12.5" font-weight="700" fill="#1A1A1A" text-anchor="start">vencerSolicitudes</text><text x="340.0" y="644.0" font-family="Inter" font-size="12.5" font-weight="400" fill="#2F5F94" text-anchor="start">HU-10 · HU-13</text><text x="460.0" y="644.0" font-family="Inter" font-size="12.5" font-weight="400" fill="#333" text-anchor="start">Solicitud sin resolver al inicio del turno más próximo: pasa a Vencida y ya no se aprueba ni rechaza.</text><rect x="40" y="730" width="1720" height="58.875" rx="6" fill="#FFF8E1" stroke="#E0C068"/><text x="52.0" y="754.0" font-family="Inter" font-size="12.5" font-weight="700" fill="#1A1A1A" text-anchor="start">Condiciones (HU-15, HU-17)</text><text x="52.0" y="776.0" font-family="Inter" font-size="12.5" font-weight="400" fill="#333" text-anchor="start">Solo se evalúan turnos publicados y días disponibles (CA-17.5); evaluar otra vez no repite el incumplimiento (CA-17.2); el aviso llega en 2 minutos o menos desde que se cumple el umbral (CA-17.1). El umbral de 15 min es configurable (HU-17).</text><rect x="40" y="880" width="1720" height="58.875" rx="6" fill="#FFF8E1" stroke="#E0C068"/><text x="52.0" y="904.0" font-family="Inter" font-size="12.5" font-weight="700" fill="#1A1A1A" text-anchor="start">Patrones GoF en este componente</text><text x="52.0" y="926.0" font-family="Inter" font-size="12.5" font-weight="400" fill="#333" text-anchor="start">Ningún patrón propio: llama a operaciones fijas de Asistencia y de Cambios de turno. Al vencer una solicitud, SolicitudCambio.vencer() aplica State y notifica a sus observadores (Observer).</text><text x="40.0" y="968.9" font-family="Inter" font-size="14" font-weight="700" fill="#1A1A1A" text-anchor="start">Leyenda</text><rect x="40" y="984.875" width="34" height="18" fill="#FFF2CC" stroke="#333"/><text x="84.0" y="998.9" font-family="Inter" font-size="12.5" font-weight="400" fill="#333" text-anchor="start">Clase de servicio (operaciones de las HU)</text><rect x="440" y="984.875" width="34" height="18" fill="#E6F4EA" stroke="#333"/><text x="484.0" y="998.9" font-family="Inter" font-size="12.5" font-weight="400" fill="#333" text-anchor="start">Entidad / enumeración</text><rect x="840" y="984.875" width="34" height="18" fill="#F3E5F5" stroke="#333"/><text x="884.0" y="998.9" font-family="Inter" font-size="12.5" font-weight="400" fill="#333" text-anchor="start">Valor o resultado</text><rect x="40" y="1012.875" width="34" height="18" fill="#F7F7F7" stroke="#333"/><text x="84.0" y="1026.9" font-family="Inter" font-size="12.5" font-weight="400" fill="#333" text-anchor="start">Consulta (vista de solo lectura)</text><rect x="440" y="1012.875" width="34" height="18" fill="#DDDDDD" stroke="#333" stroke-dasharray="4 3"/><text x="484.0" y="1026.9" font-family="Inter" font-size="12.5" font-weight="400" fill="#333" text-anchor="start">Otro componente del nivel 3</text><rect x="840" y="1012.875" width="34" height="18" fill="#BDBDBD" stroke="#333" stroke-dasharray="4 3"/><text x="884.0" y="1026.9" font-family="Inter" font-size="12.5" font-weight="400" fill="#333" text-anchor="start">Sistema externo</text><path d="M40.0,1049.9 L74.0,1049.9" fill="none" stroke="#333" stroke-width="1.3" stroke-dasharray="7 5" marker-end="url(#open)"/><text x="84.0" y="1054.9" font-family="Inter" font-size="12.5" font-weight="400" fill="#333" text-anchor="start">Usa / depende de</text><path d="M440.0,1049.9 L474.0,1049.9" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#open)" marker-start="url(#diam)"/><text x="484.0" y="1054.9" font-family="Inter" font-size="12.5" font-weight="400" fill="#333" text-anchor="start">Compuesto por (multiplicidad)</text><rect x="1054.1" y="158.0" width="240.9" height="16" fill="#FFFFFF"/><text x="1174.6" y="171.0" font-family="Inter" font-size="12.5" font-weight="500" fill="#333" text-anchor="middle">incumplimientos y pendientes de cierre</text><rect x="1151.8" y="318.5" width="143.2" height="16" fill="#FFFFFF"/><text x="1223.4" y="331.5" font-family="Inter" font-size="12.5" font-weight="500" fill="#333" text-anchor="middle">solicitudes sin resolver</text></svg>